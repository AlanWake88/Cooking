<style>
/* Layout: an editorial menu. Studio photographs on a greige ground, thin-ruled spec cards laid over the empty part of each photo,
   one geometric display face, one flared serif for card titles, mono for data. A single photographic look, no dark variant. */
:root {
  color-scheme: light;
  --bg: #E6E0D5;
  --card: #EFEAE1;
  --ink: #1E1B17;
  --muted: #6C6559;

  --font-serif: "Philosopher", "Optima", "Candara", Georgia, serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--font-display); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
button:focus-visible, input:focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }

.wrap { max-width: 520px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(104px + env(safe-area-inset-bottom, 0px)); }
.mono { font: 400 11px/1.4 var(--font-mono); letter-spacing: .02em; }
.spaced { font: 400 11px/1.4 var(--font-mono); letter-spacing: .42em; text-transform: uppercase; color: var(--muted); }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-block: 14px 12px; border-bottom: 1px solid var(--hair); }
.bar .brand { font: 600 15px/1 var(--font-display); letter-spacing: .02em; text-transform: uppercase; }
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--bg); border-top: 1px solid var(--line);
  padding: 0 max(8px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-left, 0px)); }
.dock-in { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.dock button { position: relative; display: grid; justify-items: center; gap: 5px; padding: 12px 2px 11px; font: 400 10px/1 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

.dock button[aria-current="page"] { color: var(--ink); }
.dock button[aria-current="page"]::before { content: ""; position: absolute; top: -1px; left: 28%; right: 28%; height: 2px; background: var(--dot); }

.poster { position: relative; margin-top: 14px; aspect-ratio: 2 / 3; max-width: 100%; overflow: hidden; background: var(--stone); }
.poster > img { width: 100%; height: 100%; object-fit: cover; object-position: center bottom; }

.poster h1 { position: absolute; left: 6%; right: 6%; top: 15%; margin: 0; font: 600 clamp(40px, 13.5vw, 72px)/.92 var(--font-display); letter-spacing: -.02em; text-transform: uppercase; }

/* dish page */

.row .q { font: 400 12px/1.4 var(--font-mono); text-align: right; white-space: nowrap; }

/* flow: round photos joined by thin lines */
.flow { display: grid; justify-items: center; }
.fcols { display: grid; width: 100%; }
.fcol { display: grid; justify-items: center; align-content: start; grid-auto-rows: min-content; text-align: center; padding-inline: 4px; min-width: 0; }
.srcs { display: flex; justify-content: center; padding-left: 10px; }
.srcs img, .srcs i { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; object-position: center 72%; margin-left: -10px; box-shadow: 0 0 0 2px var(--bg); background: var(--stone); }

.fn { display: grid; justify-items: center; gap: 5px; max-width: 100%; text-align: center; }
.fn .ph { width: 78px; height: 78px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; background: var(--card); box-shadow: 0 0 0 1px var(--line); font: 400 26px/1 var(--font-serif); color: var(--muted); }
.fn .ph img { width: 100%; height: 100%; object-fit: cover; }

/* illustrated steps */

.step.pic > img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: var(--stone); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }

.item.done span { text-decoration: line-through; color: var(--muted); }

.receipt footer { display: flex; justify-content: space-between; align-items: baseline; margin-inline: -14px; padding: 10px 14px 12px; border-top: 1px solid var(--line); margin-top: -1px; }
.receipt footer b { font: 400 22px/1 var(--font-serif); }
.empty { border: 1px solid var(--line); padding: 22px 16px; display: grid; gap: 14px; justify-items: start; }
.empty p { margin: 0; }

/* overlays */
.veil { position: fixed; inset: 0; z-index: 20; background: #1E1B1766; display: grid; align-items: end; justify-items: center; }
.sheet { width: 100%; max-width: 520px; max-height: 92vh; overflow: auto; background: var(--bg); border-top: 1px solid var(--ink);
  padding: 20px max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 18px; align-content: start; }
.sheet.full { height: 100%; max-height: 100%; border-top: 0; padding-top: calc(18px + env(safe-area-inset-top, 0px)); grid-template-rows: auto auto 1fr auto; }
.sheet-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }

.timer-val.end { color: var(--dot); }
.pair { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
.pair .cta { text-align: center; padding-block: 15px; }
.cta[disabled] { opacity: .3; cursor: default; }
.rule { height: 2px; background: var(--hair); position: relative; }
.rule i { position: absolute; inset: 0 auto 0 0; background: var(--dot); }
.toast { position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40; background: var(--ink); color: var(--card); padding: 10px 16px; font: 400 12px/1.3 var(--font-mono); max-width: calc(100% - 32px); text-align: center; }
.foot { padding-top: 40px; display: grid; gap: 8px; color: var(--muted); }

<script>
const DATA = /*DATA*/;
const { DISHES, ALLERGENS, FLOWS } = DATA;
const ORDER = ["omelet", "buckwheat", "soup", "pasta", "shawarma"];
const META = {
  omelet:    { title: "Омлет со шпинатом и сыром", cat: "Завтрак", diff: 2 },
  buckwheat: { title: "Гречка с курицей",          cat: "Обед",    diff: 2 },
  soup:      { title: "Куриный суп с вермишелью",  cat: "Обед",    diff: 3 },
  pasta:     { title: "Паста с индейкой",          cat: "Ужин",    diff: 2 },
  shawarma:  { title: "Домашняя шаурма",           cat: "Ужин",    diff: 3 }
};
// photos for the illustrated example: ingredient pictures by index, one picture per step, optional per-action overrides
const VIS = {
  buckwheat: {
    ing: ["img/bw/i-buckwheat.jpg", "img/bw/i-water.jpg", "img/bw/i-chicken.jpg", "img/bw/i-cucumber.jpg", "img/bw/i-oil.jpg", "img/bw/i-salt.jpg"],
    steps: ["img/bw/s1.jpg", "img/bw/s2.jpg", "img/bw/s3.jpg", "img/bw/s4.jpg", "img/bw/s5.jpg", "img/bw/s6.jpg", "img/buckwheat.jpg"],
    acts: { "Нарезать кружочками": "img/bw/cut.jpg" }
  }
};
const SECTIONS = [["Мясо и рыба", /кур|фарш|говядин|рыб/i], ["Молочное и яйца", /яйц|сыр|сметан|молок|йогурт/i], ["Крупы и хлеб", /гречк|паста|вермишел|лапша|хлеб|лаваш|хлебц/i],
  ["Овощи и зелень", /картоф|морков|лук|огур|помидор|капуст|шпинат|зелень|базилик|чеснок|томат|кетчуп/i]];
const BASE = "Специи и базовое";

const store = {
  get(k, d) { try { const v = localStorage.getItem("chtoPoestStudio:" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("chtoPoestStudio:" + k, JSON.stringify(v)); } catch {} }
};
const state = { people: store.get("people", 1), allergies: store.get("allergies", []), ov: store.get("ov", {}), cart: store.get("cart", []), checked: store.get("checked", {}), steps: {}, view: "home", dish: null };
const $ = (s) => document.querySelector(s);
const fmt = (n) => n.toLocaleString("ru-RU");
const names = (keys) => keys.map(k => ALLERGENS[k]).join(", ");
const no = (id) => String(ORDER.indexOf(id) + 1).padStart(2, "0");
const plural = (n, a, b, c) => { const m = n % 100, k = n % 10; return m > 10 && m < 20 ? c : k === 1 ? a : k > 1 && k < 5 ? b : c; };
const shortName = (n) => n.split(/ \(| вместо|, /)[0].replace(/^Соус: /, "Соус: ");

/* ingredients, swaps, quantities */
function resolveIng(id) {
  return DISHES[id].ing.map((g, i) => {
    const hit = (g.a || []).filter(a => state.allergies.includes(a));
    const forced = hit.length > 0 && !!g.alt, manual = !!(state.ov[id] && state.ov[id][i]) && !!g.alt;
    return { ...g, i, hit, forced, manual, swapped: forced || manual, blocked: hit.length > 0 && !g.alt };
  });
}
const FRAC = { "½": 0.5, "⅓": 1 / 3, "¼": 0.25, "⅔": 2 / 3 };
const UNIT_ABBR = [["стакан", "стак."], ["ломтик", "ломт."], ["зубчик", "зубч."], ["лист", "лист."], ["банк", "банк."]];
const QTY_RE = /^(по )?(\d+(?:[.,]\d+)?|[½⅓¼⅔])\s*(г|мл|кг|л|шт|ст\. л\.|ч\. л\.|стакан[а-я]*|ломтик[а-я]*|зубчик[а-я]*|лист[а-я]*|банк[а-я]*)(?![а-я])/;
function parseQty(q) {
  const m = q.match(QTY_RE);
  if (!m) return null;
  const ab = UNIT_ABBR.find(u => m[3].startsWith(u[0]));
  return { pre: m[1] || "", val: FRAC[m[2]] ?? parseFloat(m[2].replace(",", ".")), unit: ab ? ab[1] : m[3], rest: q.slice(m[0].length) };
}
function fmtNum(v, unit) {
  if (unit === "г" || unit === "мл") return String(Math.max(5, Math.round(v / 5) * 5));
  if (unit === "шт" && v >= 1) return String(Math.round(v));
  v = Math.max(0.5, Math.round(v * 2) / 2);
  return v % 1 ? `${Math.floor(v) || ""}½` : String(v);
}
function scaleQty(q, k) {
